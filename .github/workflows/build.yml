name: Build FlagLive APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FlagLive-source1.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir source
          unzip -o FlagLive-source1.zip -d source
          ls -la source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/FlagLive
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        working-directory: source/FlagLive
        run: |
          echo "=== ERRORS ==="
          grep -n -B2 -A12 -E "error:|What went wrong|Could not resolve|FAILED" build.log | head -120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlagLive-debug-apk
          path: source/FlagLive/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
